name: Acceptance
on:
  push:
    branches: [omp-system/acceptance-20261027]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun node_modules/typescript/bin/tsc --noEmit
      - name: Portable behavior and gate contracts
        run: bun test tests/runtime.test.ts tests/effort-recovery.test.ts tests/token-limits.test.ts tests/state-gate.test.ts tests/gate-provenance.test.ts tests/budget.test.ts tests/model-budget.test.ts tests/authority.test.ts tests/run-spec.test.ts tests/workflow-verification.test.ts src/harness/method.test.ts
